<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="Reflection and Snell's Law Refraction Diagram">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    .math  { font: italic 13px Georgia, serif; fill: #1e293b; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .formula { font: 600 12px "JetBrains Mono", monospace; fill: #1e293b; }
  </style>

  <!-- Background & media split -->
  <rect x="0" y="0" width="680" height="195" fill="#f8fafc"/>
  <rect x="0" y="195" width="680" height="185" fill="#e0f2fe"/>
  <line x1="24" y1="195" x2="656" y2="195" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Title -->
  <text x="24" y="28" class="title">Specular Reflection &amp; Snell's Law Refraction</text>
  <text x="36" y="182" class="small">Medium 1: index &#951;&#8321; (e.g. Air = 1.0)</text>
  <text x="36" y="216" class="small">Medium 2: index &#951;&#8322; (e.g. Glass = 1.5)</text>

  <!-- Normal line -->
  <line x1="320" y1="45" x2="320" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="320" y1="195" x2="320" y2="85" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="328" y="95" class="label">n (unit normal)</text>

  <!-- Incident ray v -->
  <line x1="170" y1="70" x2="316" y2="191" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="155" y="62" class="label" fill="#2563eb">Incident ray v</text>

  <!-- Reflected ray r -->
  <line x1="320" y1="195" x2="470" y2="70" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="455" y="62" class="label" fill="#059669">Reflected ray r</text>

  <!-- Refracted ray t -->
  <line x1="320" y1="195" x2="405" y2="345" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="415" y="346" class="label" fill="#d97706">Refracted ray t</text>

  <!-- Hit point -->
  <circle cx="320" cy="195" r="4.5" fill="#0f172a"/>

  <!-- Angle arcs -->
  <path d="M 320 140 A 55 55 0 0 0 278 160" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="285" y="136" class="math">&#952;&#8321;</text>

  <path d="M 320 140 A 55 55 0 0 1 362 160" fill="none" stroke="#059669" stroke-width="1.8"/>
  <text x="342" y="136" class="math">&#952;&#8321;</text>

  <path d="M 320 255 A 60 60 0 0 0 350 247" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <text x="331" y="272" class="math">&#952;&#8322;</text>

  <!-- Formula box -->
  <rect x="448" y="218" width="212" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="460" y="242" class="label">Formulas</text>
  <text x="460" y="264" class="formula">r = v - 2(v&#183;n)n</text>
  <text x="460" y="286" class="formula">&#951;&#8321; sin(&#952;&#8321;) = &#951;&#8322; sin(&#952;&#8322;)</text>
  <text x="460" y="308" class="small">TIR if (&#951;&#8321;/&#951;&#8322;)&#183;sin(&#952;&#8321;) &gt; 1</text>
</svg>
