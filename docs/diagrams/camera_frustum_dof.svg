<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="Perspective Camera Frustum and Thin-Lens Depth of Field Diagram">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
  </style>

  <rect width="680" height="340" fill="#ffffff"/>
  <text x="24" y="28" class="title">Perspective Camera Frustum &amp; Thin-Lens Defocus Blur (Depth of Field)</text>

  <!-- Defocus disk (lens aperture) -->
  <ellipse cx="95" cy="175" rx="12" ry="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="95" cy="175" r="4" fill="#0f172a"/>
  <text x="34" y="242" class="label">look_from</text>
  <text x="24" y="258" class="small">(Defocus Disk)</text>

  <!-- Optical axis (-w) -->
  <line x1="95" y1="175" x2="620" y2="175" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="580" y="168" class="small">-w axis</text>

  <!-- Frustum bounds -->
  <line x1="95" y1="175" x2="430" y2="62" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="95" y1="175" x2="430" y2="288" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Focal plane / viewport -->
  <rect x="424" y="62" width="12" height="226" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="372" y="52" class="label">Focal Plane / Viewport</text>
  <text x="380" y="308" class="small">pixel00_loc + x&#183;&#916;u + y&#183;&#916;v</text>

  <!-- Rays from aperture converging on focal point -->
  <circle cx="430" cy="130" r="5" fill="#dc2626"/>
  <text x="444" y="128" class="label" fill="#dc2626">Pixel Sample</text>

  <line x1="95" y1="140" x2="424" y2="130" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="95" y1="210" x2="424" y2="131" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="95" y1="175" x2="424" y2="130" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- Past focal plane rays diverge -->
  <line x1="430" y1="130" x2="615" y2="124" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="430" y1="130" x2="615" y2="85" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="512" y="80" class="small">Out-of-focus blur</text>

  <!-- Focus distance bracket -->
  <line x1="95" y1="316" x2="430" y2="316" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="95" y1="310" x2="95" y2="322" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="430" y1="310" x2="430" y2="322" stroke="#0f172a" stroke-width="1.5"/>
  <text x="228" y="333" class="label">focus_dist</text>

  <!-- vfov angle arc -->
  <path d="M 168 150 A 76 76 0 0 1 168 200" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="176" y="179" class="label" fill="#2563eb">vfov</text>
</svg>
