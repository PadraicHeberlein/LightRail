<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="LightRail Rendering Pipeline Diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .box-t { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .sub   { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .lbl   { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2563eb; }
  </style>

  <rect width="760" height="220" fill="#ffffff"/>
  <text x="20" y="26" class="title">LightRail Whitted Ray Tracing Pipeline</text>

  <!-- Stage 1: Camera -->
  <rect x="20" y="54" width="126" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="54" y="80" class="box-t">Camera</text>
  <text x="36" y="100" class="sub">get_ray(x, y)</text>
  <text x="36" y="118" class="sub">SSAA + Thin-Lens</text>

  <!-- Stage 2: Renderer -->
  <rect x="172" y="54" width="132" height="84" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="204" y="80" class="box-t">Renderer</text>
  <text x="186" y="100" class="sub">std::thread scanlines</text>
  <text x="186" y="118" class="sub">trace_ray(depth)</text>

  <!-- Stage 3: Scene / Hittable -->
  <rect x="330" y="54" width="132" height="84" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="356" y="80" class="box-t">Scene / Hittable</text>
  <text x="344" y="100" class="sub">Plane, Sphere, Tri</text>
  <text x="344" y="118" class="sub">Mesh (.obj) -&gt; HitRec</text>

  <!-- Stage 4: Material & Lights -->
  <rect x="488" y="54" width="132" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="504" y="80" class="box-t">Material &amp; Light</text>
  <text x="500" y="100" class="sub">Blinn-Phong + Shadow</text>
  <text x="500" y="118" class="sub">Reflect / Refract</text>

  <!-- Stage 5: Image -->
  <rect x="644" y="54" width="96" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="670" y="80" class="box-t">Image</text>
  <text x="658" y="100" class="sub">Gamma 2.0</text>
  <text x="658" y="118" class="sub">.ppm / .bmp</text>

  <!-- Forward arrows -->
  <line x1="146" y1="96" x2="168" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="304" y1="96" x2="326" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="96" x2="484" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="96" x2="640" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recursive bounce loop -->
  <path d="M 554 138 L 554 182 L 238 182 L 238 142" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="310" y="200" class="lbl">Recursive reflection / refraction bounce (depth &lt; max_depth)</text>
</svg>
