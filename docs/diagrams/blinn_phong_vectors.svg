<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="Blinn-Phong Illumination Vectors Diagram">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .formula { font: 600 12px "JetBrains Mono", monospace; fill: #1e293b; }
  </style>

  <rect width="680" height="330" fill="#ffffff"/>
  <text x="24" y="28" class="title">Blinn&#8211;Phong Illumination Model Vectors</text>

  <!-- Surface -->
  <rect x="30" y="258" width="400" height="32" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="230" cy="258" r="5" fill="#0f172a"/>
  <text x="223" y="279" class="label">P</text>

  <!-- Normal N -->
  <line x1="230" y1="258" x2="230" y2="82" stroke="#334155" stroke-width="2.8" marker-end="url(#arrow-slate)"/>
  <text x="218" y="68" class="label">N (Normal)</text>

  <!-- Light L -->
  <line x1="230" y1="258" x2="96" y2="115" stroke="#d97706" stroke-width="2.8" marker-end="url(#arrow-amber)"/>
  <circle cx="88" cy="107" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="54" y="88" class="label" fill="#d97706">L (To Light)</text>

  <!-- View V -->
  <line x1="230" y1="258" x2="386" y2="142" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <text x="372" y="128" class="label" fill="#2563eb">V (To Camera)</text>

  <!-- Halfway vector H -->
  <line x1="230" y1="258" x2="262" y2="108" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="6,3" marker-end="url(#arrow-purple)"/>
  <text x="272" y="106" class="label" fill="#7c3aed">H = norm(L + V)</text>

  <!-- Formula card -->
  <rect x="448" y="54" width="212" height="204" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="462" y="78" class="label">Shading Terms</text>
  <text x="462" y="104" class="small">Ambient:</text>
  <text x="462" y="122" class="formula">k_a &#183; I_a &#183; albedo</text>
  <text x="462" y="148" class="small">Diffuse (Lambertian):</text>
  <text x="462" y="166" class="formula">k_d &#183; max(0, N&#183;L)</text>
  <text x="462" y="192" class="small">Specular (Blinn):</text>
  <text x="462" y="210" class="formula">k_s &#183; max(0, N&#183;H)^s</text>
  <text x="462" y="242" class="small">s = shininess exponent</text>
</svg>
