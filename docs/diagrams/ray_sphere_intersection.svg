<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="Ray-Sphere Quadratic Intersection Diagram">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <radialGradient id="sphere-grad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </radialGradient>
  </defs>

  <style>
    .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .formula { font: 600 12px "JetBrains Mono", monospace; fill: #1e293b; }
  </style>

  <rect width="680" height="340" fill="#ffffff"/>
  <text x="24" y="28" class="title">Analytical Ray–Sphere Intersection</text>

  <!-- Sphere -->
  <circle cx="410" cy="175" r="105" fill="url(#sphere-grad)" stroke="#2563eb" stroke-width="2"/>
  <circle cx="410" cy="175" r="4" fill="#0f172a"/>
  <text x="418" y="182" class="label">C (center)</text>

  <!-- Radius R -->
  <line x1="410" y1="175" x2="490" y2="243" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="454" y="206" class="label">R</text>

  <!-- Ray O + tD -->
  <circle cx="70" cy="245" r="4.5" fill="#2563eb"/>
  <text x="42" y="268" class="label">O (origin)</text>
  <line x1="70" y1="245" x2="575" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="155" y="202" class="label" fill="#2563eb">P(t) = O + tD</text>

  <!-- Vector oc = O - C -->
  <line x1="410" y1="175" x2="76" y2="244" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4"/>
  <text x="235" y="232" class="small">oc = O - C</text>

  <!-- Intersection points t1, t2 -->
  <circle cx="315" cy="175" r="5" fill="#dc2626"/>
  <text x="278" y="164" class="label" fill="#dc2626">P(t&#8321;)</text>

  <circle cx="505" cy="120" r="5" fill="#dc2626"/>
  <text x="515" y="114" class="label" fill="#dc2626">P(t&#8322;)</text>

  <!-- Outward normal at t1 -->
  <line x1="315" y1="175" x2="255" y2="132" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="165" y="122" class="label" fill="#059669">N = (P(t&#8321;) - C) / R</text>

  <!-- Discriminant box -->
  <rect x="24" y="46" width="238" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="68" class="formula">a&#183;t&#178; + 2h&#183;t + c = 0</text>
  <text x="36" y="88" class="formula">&#916; = h&#178; - a&#183;c</text>
  <text x="135" y="88" class="small">(&#916; &gt; 0: 2 hits)</text>
</svg>
